[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signbridge-brain"
version = "0.1.0"
description = "SignBridge Component B: MediaPipe feature engineering + BiLSTM-CTC model for continuous SLSL recognition"
requires-python = ">=3.10,<3.12"
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0",
  "scipy>=1.11",
  "torch>=2.2",
]

[project.optional-dependencies]
# Only needed for real video -> landmark extraction (not for mock data).
extract = ["mediapipe==0.10.14", "opencv-python>=4.9"]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
